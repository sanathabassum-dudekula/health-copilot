name: Reminder Push Dispatcher

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Check scheduler secret
        run: |
          if [[ -z "$CRON_SECRET" ]]; then
            echo "::error::Add CRON_SECRET as a repository Actions secret."
            exit 1
          fi
      - name: Dispatch due reminders
        run: |
          curl --fail --silent --show-error --max-time 55 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "https://curamind-backend.vercel.app/reminders/dispatch"
